name: Run Amazon Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # ഓരോ മണിക്കൂറിലും ഒരു തവണ ഓടുന്നു
  workflow_dispatch:

jobs:
  run-scraper:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiogram motor playwright playwright-stealth
        playwright install chromium

    - name: Run script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: python bot.py
