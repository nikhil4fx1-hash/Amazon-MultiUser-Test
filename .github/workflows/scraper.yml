name: Run Amazon Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: Multi  # <- ഇത് ഇവിടെ കൃത്യമായി ചേർക്കണം (Image 4-ൽ കണ്ട എൻവയോൺമെന്റ് പേര്)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram motor playwright playwright-stealth
          playwright install chromium

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
        run: python bot.py
